<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Movie Collection</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0e1214"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Movies"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Movie Collection: projection booth / ticket stub identity.
   Solid surfaces only (no glass, no blur). Ink base, warm paper in light mode, one teal accent. */
:root{
  --bg:#efe6d0;--p:#f9f3e2;--in:#e7ddc4;--ln:#cbbf9e;--tx:#1b1f1d;--mu:#575c53;
  --ac:#0b7d6e;--acx:#ffffff;--bad:#a8281f;--sc:rgba(20,18,10,.45);
  --fd:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px;--rail:96px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1214;--p:#161c20;--in:#1e262b;--ln:#2d383f;--tx:#ece6d3;--mu:#9aa49d;
  --ac:#3dd3b8;--acx:#06201b;--bad:#ff8a7a;--sc:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:16px/1.4 var(--fb)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

#shell{position:fixed;inset:0}
#scr{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(8px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
#app{margin:0 auto}

/* type */
h1{font:600 40px/1 var(--fd);text-transform:uppercase;letter-spacing:.03em;margin:0}
h2{display:flex;align-items:center;gap:12px;font:600 16px/1 var(--fd);text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:26px 0 12px}
h2::after{content:"";flex:1;border-top:2px dashed var(--ln)}
h3{margin:0 0 10px;font:600 22px/1.1 var(--fd);letter-spacing:.02em}
.sub{color:var(--mu);font-size:13px}
.big{font:600 34px/1 var(--fd);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin:14px 0 18px}
.cnt{color:var(--mu);font-size:13px;margin:2px 2px 10px}
.txt{font-size:15px;line-height:1.55}
.empty{padding:18px;color:var(--mu);font-size:14px;border:2px dashed var(--ln);border-radius:var(--r)}
.load{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:60vh;color:var(--mu)}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--ac);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* surfaces */
.card{background:var(--p);border:1px solid var(--ln);border-radius:var(--r)}
.pad{padding:16px}
.tile{background:var(--p);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles.t8{grid-template-columns:repeat(2,1fr);gap:10px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 28px;align-items:start}
.pair>section{min-width:0}

/* controls */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--ac);border-radius:var(--r);background:var(--ac);color:var(--acx);font:600 18px/1 var(--fd);text-transform:uppercase;letter-spacing:.06em;transition:filter .12s,transform .08s,background .12s}
.picks .btn,.btnrow .btn,.sf>.btn,.dlg .btn,.sheet .btn[data-act="move"],.sheet .btn[data-act="del"],.card>.btn,.stk .btn{width:auto}
.picks .btn{width:100%;min-height:clamp(52px,5.4vw,120px);font-size:clamp(16px,1.9vw,44px);letter-spacing:.03em;white-space:nowrap;padding:0 8px;gap:clamp(8px,.8vw,18px)}
.picks .btn svg{width:clamp(22px,2.2vw,48px);height:clamp(22px,2.2vw,48px)}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--ln)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:0 14px;font-size:16px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost:hover{border-color:var(--mu);background:var(--in);filter:none}
.btn:active{transform:translateY(1px);filter:brightness(.94)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.busy{color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--acx);border-top-color:transparent;animation:spin .7s linear infinite}
.btn.ghost.busy::after,.btn.danger.busy::after{border-color:var(--tx);border-top-color:transparent}
.btn.ok{color:transparent!important}
.btn.ok::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:8px;border-left:3px solid var(--acx);border-bottom:3px solid var(--acx);transform:rotate(-45deg) translate(1px,-2px)}
.btn.ghost.ok::after{border-color:var(--ac)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.more{width:100%;margin-top:12px}
.filt{position:relative}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--ac);color:var(--acx);font:600 13px/1 var(--fb)}
.seg .on .bdg{background:var(--tx);color:var(--bg)}

input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--ln);background:var(--in);color:var(--tx);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--mu)}
input:disabled{opacity:.5}
label{display:block;font:600 14px/1 var(--fd);text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:16px 2px 6px}
.pad>label:first-child{margin-top:0}
.pad>.grid2:first-child{margin-top:-14px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mi{position:relative}.mi span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu)}.mi input{padding-left:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid2 .span2{grid-column:1/-1}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.g3>div>label{margin-top:14px}
.grid2>div>label{margin-top:14px}
.srch{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0 14px;border:1px solid var(--ln);border-radius:var(--r);background:var(--p);min-height:46px;color:var(--mu);margin:0;text-transform:none;letter-spacing:0;font:inherit}
.srch input{flex:1;min-width:0;background:none;border:0;padding:12px 0;min-height:44px;outline:0}
.srch:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.stk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:12;display:flex;gap:10px;padding:6px 0;margin-bottom:10px;background:var(--bg)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--ln);border-radius:var(--r);background:var(--p);overflow-x:auto;scrollbar-width:none;margin:0 0 14px}
.seg.wide{width:100%}
.seg button{flex:1 0 auto;min-height:44px;padding:0 14px;border:0;border-radius:4px;background:none;font:600 17px/1 var(--fd);text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.seg .on{background:var(--tx);color:var(--bg)}
.seg button:not(.on):hover{background:var(--in);color:var(--tx)}
.seg button:active{transform:translateY(1px)}
.sheet .seg{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--ln);border-radius:var(--r);background:transparent;font-weight:500;font-size:15px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:600}
.chip:not(.on):hover{background:var(--in);border-color:var(--mu)}
.chip:active{transform:translateY(1px)}
.fg{margin-bottom:12px}.fgl{font:600 14px/1 var(--fd);text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:2px 2px 8px}
.addfmt{display:flex;gap:8px;margin-top:8px}.addfmt input{flex:1}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px dashed var(--ln)}
.fr:last-child{border-bottom:0}
.swb{flex:none;position:relative;width:60px;height:44px;border:0;background:none;padding:0}
.swb::before{content:"";position:absolute;left:4px;top:8px;width:52px;height:28px;border-radius:14px;background:var(--in);border:1px solid var(--ln);transition:background .2s,border-color .2s}
.swb::after{content:"";position:absolute;left:8px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:transform .2s,background .2s}
.swb.on::before{background:var(--ac);border-color:var(--ac)}.swb.on::after{transform:translateX(24px);background:var(--acx)}
.swb:hover::before{border-color:var(--mu)}
.swb:active::after{width:24px}
.ferr{margin:12px 2px 0;padding:12px 14px;border-radius:var(--r);border:1px solid var(--bad);color:var(--bad);font-size:14px;font-weight:500}
.kv{display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:40px;border-bottom:1px dashed var(--ln);font-size:15px}
.kv:last-of-type{border-bottom:0}
.kv b{font-weight:600;text-align:right}
.yes,.no{display:inline-flex;align-items:center;gap:6px}.yes{color:var(--ac)}.no{color:var(--bad)}
.prog{margin-top:14px}.prog .sub{margin-top:6px}

/* ticket-stub rows */
.tix{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px;margin-bottom:6px}
.tk{position:relative;display:flex;align-items:stretch;min-height:80px;background:var(--p);border:1px solid var(--ln);border-radius:var(--r);cursor:pointer;transition:border-color .12s,transform .08s}
.tk.plain{cursor:default}
.tk::before,.tk::after{content:"";position:absolute;left:62px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--ln);transform:translateX(-7px);z-index:1}
.tk::before{top:-8px;clip-path:inset(50% 0 0 0)}
.tk::after{bottom:-8px;clip-path:inset(0 0 50% 0)}
.tk:hover{border-color:var(--mu)}
.tk:active{transform:scale(.99)}
.stub{flex:none;width:62px;display:flex;align-items:center;justify-content:center;padding:6px}
.bd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-left:2px dashed var(--ln)}
.bd .g{flex:1;min-width:0}
.bd b{display:block;font:600 19px/1.15 var(--fd);letter-spacing:.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.heart{display:flex;color:var(--ac)}
.ck{display:flex;color:var(--ac)}
.rnum{display:inline-flex;align-items:center;gap:3px;font:600 15px/1 var(--fd);color:var(--ac)}
.th{width:44px;height:64px;border-radius:3px;object-fit:cover;flex:none;background:var(--in);display:block}
.th.ph{display:flex;align-items:center;justify-content:center;font:600 24px var(--fd);color:var(--mu)}
.th.big{width:96px;height:140px;border-radius:4px;font-size:40px}
.res{display:flex;flex-direction:column;gap:6px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts .btn{width:100%;padding:0 6px}

/* bars and charts */
.br{margin:0 0 12px}.br:last-child{margin:0}
.brl{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px;font-weight:500}
.track{height:8px;border-radius:4px;background:var(--in);overflow:hidden}
.bar{display:block;height:100%;width:0;min-width:3px;border-radius:4px;background:var(--ac);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.nomo .bar{transition:none}
.t8{margin-top:0}
.charts{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px;align-items:stretch}
.chart{display:flex;flex-direction:column;margin:0}
.bl{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bl .br{margin:0}
#app .seg.wide{max-width:520px}
.admin{column-count:1;column-gap:14px}
.admin>.card{display:inline-block;width:100%;break-inside:avoid;margin:0 0 14px}

/* rating, people */
.stars{--sz:22px;display:inline-flex}
.stars.big{--sz:40px}
.st{position:relative;width:var(--sz);height:var(--sz);display:block}
.st svg{width:var(--sz);height:var(--sz);fill:none;stroke:var(--mu);stroke-width:1.5;display:block}
.st .fill{position:absolute;left:0;top:0;height:100%;overflow:hidden}
.st .fill svg{fill:var(--ac);stroke:var(--ac)}
.rate{display:inline-flex;min-height:48px;align-items:center;cursor:pointer;border-radius:var(--r);padding:2px}
.ratebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.hs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin;border-radius:var(--r)}
.pp{flex:0 0 88px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.av{width:72px;height:72px;border-radius:50%;background:var(--in);border:1px solid var(--ln);overflow:hidden;display:grid;place-items:center;font:600 24px var(--fd);color:var(--mu)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.pp b{font-size:13px;line-height:1.2;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pp .sub{font-size:11px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.loan{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cbx{position:relative}
.cbl{position:absolute;z-index:6;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:var(--p);border:1px solid var(--mu);border-radius:var(--r);max-height:230px;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.cbl li{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:4px;cursor:pointer}
.cbl li.act,.cbl li:hover{background:var(--in)}
.cbl li.new{color:var(--ac);font-weight:600;border-top:1px dashed var(--ln);margin-top:4px}

/* nav: bottom bar on phones, left rail on wide screens */
.rail{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--p);border-top:1px solid var(--ln);padding:0 4px env(safe-area-inset-bottom,0px);z-index:20}
.tbn{position:relative;flex:1;min-width:0;min-height:60px;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 13px/1 var(--fd);text-transform:uppercase;letter-spacing:.02em}
.tbn span{white-space:nowrap}
.tbn.on{color:var(--ac)}
.tbn.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--ac);border-radius:0 0 3px 3px}
.tbn:hover{color:var(--tx);background:var(--in)}
.tbn.on:hover{color:var(--ac)}
.tbn:active{transform:translateY(1px)}

/* sheets and dialogs */
#ov{position:fixed;inset:0;z-index:40;display:none}
#ov.on,#ov.out{display:block}
.scrim{position:absolute;inset:0;background:var(--sc);cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;background:var(--p);border:1px solid var(--ln);border-bottom:0;border-radius:10px 10px 0 0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 4px;border-bottom:2px dashed var(--ln)}
.sh h3{flex:1;text-align:center;margin:0;font-size:24px;text-transform:uppercase;letter-spacing:.06em}
.ib{width:44px;height:44px;border:0;background:none;border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.ib:hover{background:var(--in)}.ib:active{transform:translateY(1px)}
.sb{overflow-y:auto;padding:0 16px 22px;flex:1;overscroll-behavior:contain}
.sf{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px dashed var(--ln)}
.sf>.btn{width:100%}
.dbt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.dbt .btn{width:100%}
.tri{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}.tri .btn{width:100%;padding:0 6px}
#ov.on.in .sheet{animation:up .32s cubic-bezier(.2,.9,.25,1)}
#ov.on.in .scrim{animation:fade .2s}
#ov.out .sheet{animation:down .22s ease-in forwards}
#ov.out .scrim{animation:fadeout .22s forwards}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes down{to{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
.dh{display:flex;gap:14px;align-items:flex-start;padding-top:16px}
.dh .g{flex:1;min-width:0}
.dt{font:600 30px/1.05 var(--fd);letter-spacing:.015em;margin-bottom:6px}
.lnk{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--ac);font-weight:600;text-decoration:none;min-height:44px}
.lnk:hover{text-decoration:underline}
#dlg{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#dlg.on{display:flex}
.scrim2{position:absolute;inset:0;background:var(--sc);animation:fade .15s;cursor:pointer}
.dlg{position:relative;width:min(380px,100%);background:var(--p);border:1px solid var(--mu);border-radius:10px;padding:20px;animation:pop .2s ease-out}
.dlg h3{font-size:26px;margin-bottom:6px}
.dlg p{margin:0 0 6px;color:var(--mu);font-size:14px}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;padding:12px 18px;border-radius:var(--r);background:var(--tx);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.toast.bad{background:var(--bad);color:#fff}
.impres{margin-top:14px;padding:12px 14px;border:1px dashed var(--ln);border-radius:var(--r)}
.impres ul{margin:8px 0 0;padding-left:18px;max-height:260px;overflow:auto;font-size:14px}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* tablet portrait */
@media(min-width:700px){
  #scr{padding-left:28px;padding-right:28px}
  .tiles.t8{grid-template-columns:repeat(4,1fr)}
  .charts{grid-template-columns:repeat(2,1fr)}
  .admin{column-count:2}
  .sheet{left:50%;right:auto;width:min(680px,100%);transform:translateX(-50%)}
  @keyframes up{from{transform:translateX(-50%) translateY(40px);opacity:0}}
  @keyframes down{to{transform:translateX(-50%) translateY(40px);opacity:0}}
}
/* laptops and desktops: rail on the left, modal sheets */
@media(min-width:1000px){
  #scr{padding-left:calc(var(--rail) + 36px);padding-right:36px;padding-bottom:40px}
  .rail{top:0;right:auto;width:var(--rail);flex-direction:column;justify-content:flex-start;gap:6px;padding:20px 8px;border-top:0;border-right:1px solid var(--ln)}
  .tbn{flex:none;min-height:64px;border-radius:var(--r)}
  .tbn.on::before{top:12px;bottom:12px;left:-1px;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .toast{bottom:28px}
  .sheet{top:50%;bottom:auto;left:calc(50% + var(--rail)/2);transform:translate(-50%,-50%);max-height:88vh;border-bottom:1px solid var(--ln);border-radius:10px}
  @keyframes up{from{transform:translate(-50%,-48%);opacity:0}}
  @keyframes down{to{transform:translate(-50%,-48%);opacity:0}}
  .charts{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .admin{column-count:2}
  .h-note{display:none}
}
@media(min-width:1500px){
  .tiles.t8{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  #scr{padding-left:calc(var(--rail) + 48px);padding-right:48px}
}
@media(min-width:2000px){
  .admin{column-count:3}
  .tix{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
  .tile .big{font-size:clamp(34px,2.2vw,64px)}
  h1{font-size:clamp(40px,2.4vw,64px)}
}
@media(min-width:3000px){.admin{column-count:4}}

/* ---------- second round ---------- */
.hbt{display:flex;gap:8px;align-items:center}
.hbt .btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px 22px}
.tgl{font:600 16px/1 var(--fd);text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:0 2px 8px}
.tile{padding:10px 8px;min-width:0}
.tile .big{font-size:28px}
.tile .sub{font-size:12px;line-height:1.15;margin-top:3px}
.tile .tx{margin-top:2px;opacity:.9}
@media(min-width:700px){.tile{padding:14px 16px}.tile .big{font-size:34px}.tile .sub{font-size:13px}}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border:2px dashed var(--ln);border-radius:var(--r);font-size:14px}
h2 .cn{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 8px;border-radius:11px;background:var(--ac);color:var(--acx);font:600 14px/1 var(--fb);letter-spacing:0}
.sortrow{display:flex;gap:10px;margin:0 0 12px}
.sortrow select{flex:1;min-width:0}
.sortrow .btn{flex:none;font-size:16px;padding:0 14px}
.fh{margin:18px 0 10px}
.tri3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}.tri3 .btn{width:100%;padding:0 6px;font-size:16px}
.chipx{display:inline-flex;align-items:stretch}
.chipx .chip{border-radius:var(--r) 0 0 var(--r);border-right:0}
.chipd{width:36px;min-height:44px;border:1px solid var(--ln);border-radius:0 var(--r) var(--r) 0;background:none;color:var(--mu);display:flex;align-items:center;justify-content:center}
.chipd:hover{background:var(--in);color:var(--tx)}

/* corner flags: each state has its own colour and says what it is */
:root{--f-want:#1f58ad;--f-ord:#3a7a17;--f-loan:#9a5226;--f-own:var(--ac)}
@media(prefers-color-scheme:dark){:root{--f-want:#2f6bc7;--f-ord:#3f8a1c;--f-loan:#b0602c}}
.flag{position:absolute;top:-1px;right:14px;z-index:3;padding:5px 9px 10px;font:600 11px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--fc,var(--ac));clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 5px),0 100%);white-space:nowrap}
.f-want{--fc:var(--f-want)}.f-ord{--fc:var(--f-ord)}.f-loan{--fc:var(--f-loan)}
.f-own{background:var(--ac);color:var(--acx)}
.tk.fl .g{padding-right:4px}
.dh{position:relative}
.dh.fl .flag{right:0}

/* up next and loaned out rows: actions sit under the title */
.tk.nx .bd{flex-wrap:wrap;align-content:center;row-gap:6px}
.tk.nx .g{flex:1 1 60%}
.ax{flex:0 0 100%;display:flex;gap:8px}
.ax .btn{min-height:40px;font-size:15px;padding:0 12px}

/* multi-select */
.cbk{flex:none;width:24px;height:24px;border:2px solid var(--mu);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--acx)}
.cbk.on{background:var(--ac);border-color:var(--ac)}
.tk.picked{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.selbar{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--p);border:1px solid var(--ac);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.selbt{display:flex;gap:8px}
@media(min-width:1000px){.selbar{left:calc(var(--rail) + 48px);right:48px;bottom:24px}}

/* detail sheet */
.cs h2{margin:22px 0 10px}
.csb{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0;border:0;background:none;text-align:left;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.csb::after{content:"";flex:1;order:1;border-top:2px dashed var(--ln)}
.csb .cv{order:2;display:flex;transition:transform .2s}
.cs.shut .csb .cv{transform:rotate(-90deg)}
.cs.shut .csbody{display:none}
.csb:hover{color:var(--tx)}
h2:has(.csb)::after{display:none}
.fmtt{font:600 24px/1 var(--fd);letter-spacing:.03em;text-transform:uppercase;margin:0 2px 14px}
.fg{margin-bottom:16px}
.fgl{font-size:13px;margin-bottom:8px}
.fsub{margin-top:12px;padding:0 12px 6px;border-left:3px solid var(--ac)}
.fsub .grid2>div>label:first-child{margin-top:12px}
.pcol{display:flex;flex-direction:column;gap:8px;align-items:stretch;flex:none}
.pbt{display:flex;flex-direction:column;gap:6px}
.pbt .btn{min-height:36px;font-size:14px;padding:0 8px}
.cbx input{padding-right:40px}
.cbt{position:absolute;right:0;top:0;width:40px;height:44px;border:0;background:none;color:var(--mu);display:flex;align-items:center;justify-content:center}
.cbl li.cur{font-weight:600;color:var(--ac)}
.cbl li.none{color:var(--mu);cursor:default}
.rwl{list-style:none;margin:0 0 10px;padding:0}
.rwl li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;border-bottom:1px dashed var(--ln);font-size:15px}
.rwl li:last-child{border-bottom:0}
.ib.sm{width:36px;height:36px}
.loan+label{margin-top:18px}

/* barcode */
.bcard h3{margin-bottom:10px}
.bcv{width:100%;max-height:260px;border-radius:var(--r);background:#000;margin:8px 0}

/* series and lists */
.btnrow .btn[disabled]{opacity:.4}

/* calendar and timeline */
.cal{background:var(--p);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin-top:14px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calt{font:600 22px/1 var(--fd);letter-spacing:.04em;text-transform:uppercase}
.flipx{display:flex;transform:scaleX(-1)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font:600 13px/1 var(--fd);letter-spacing:.1em;color:var(--mu);padding:6px 0}
.cd{position:relative;min-height:56px;border:1px solid transparent;border-radius:var(--r);background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:6px 2px;color:var(--tx)}
.cd.blank{pointer-events:none}
.cd:not(.blank):hover{background:var(--in)}
.cd.today{border-color:var(--ln)}
.cd.sel{border-color:var(--ac);background:var(--in)}
.cn1{font-size:14px;font-variant-numeric:tabular-nums}
.cdot{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--ac);color:var(--acx);font:600 12px/1 var(--fb)}
.cdot.re{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.tlm{font:600 18px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:20px 2px 10px}

/* duplicates, install */
.dups{margin-top:14px}
.dg{margin-top:12px;padding:10px 12px;border:1px dashed var(--ln);border-radius:var(--r)}
.dgt{font:600 19px/1.1 var(--fd);margin-bottom:6px}
.dr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-top:1px dashed var(--ln);font-size:14px;flex-wrap:wrap}
.dbtn{display:flex;gap:8px}
.how{margin:10px 0;padding-left:18px;font-size:14px;line-height:1.5}
a.btn{text-decoration:none}
.tgs2{float:right;font:500 12px/1 var(--fb);letter-spacing:0;text-transform:none}
@media(max-width:420px){h1{font-size:34px}}
@media(max-width:520px){.hbt .lbl{display:none}.hbt .btn.ghost{padding:0 12px}.seg.wide button{padding:0 9px;font-size:16px;letter-spacing:.03em}.bdg{margin-left:4px}}
</style></head>
